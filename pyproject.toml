[project]
name = "budget-tracker"
version = "0.1.0"
description = "Personal budget from bank CSV exports"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "pandas>=2.2",
    "pyrage>=1.4.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["budget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
